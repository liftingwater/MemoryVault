AWSTemplateFormatVersion: "2010-09-09"
Description: MemoryVault — full AWS infrastructure stack

Parameters:
  ArtifactsBucket:
    Type: String
    Description: S3 bucket containing packaged Lambda code and layer zips
  LambdaCodeKey:
    Type: String
    Default: lambda/app.zip
    Description: S3 key of the Lambda function zip
  LambdaLayerKey:
    Type: String
    Default: lambda/layer.zip
    Description: S3 key of the Lambda layer zip
  AllowedOrigins:
    Type: String
    Default: "*"
    Description: >
      Comma-separated origins the FastAPI CORS middleware will accept.
      Defaults to * for the initial deploy. The deploy script updates the
      Lambda environment variable to the CloudFront URL after stack creation,
      avoiding a circular dependency between ApiFunction and Distribution.

Resources:

  # ── S3: Frontend static assets ───────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ── S3: Deck context files (AI memory per deck) ──────────────────────────
  ContextBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── CloudFront ────────────────────────────────────────────────────────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # SPA deep-link fallback, scoped to the S3 (default) behavior only. Client
  # routes like /dashboard or /decks/{id} have no file extension and no S3
  # object, so rewrite them to the SvelteKit entry point. Requests with an
  # extension (static assets) pass through. /api/* and /health use their own
  # behaviors and never hit this function, so API 4xx responses are no longer
  # masked as index.html (which distribution-wide CustomErrorResponses did).
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extension-less SPA routes to /index.html
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;
            var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
            if (lastSegment.indexOf('.') === -1) {
                request.uri = '/index.html';
            }
            return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: ApiGateway
            DomainName: !Sub "${Api}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: "/health"
            TargetOriginId: ApiGateway
            ViewerProtocolPolicy: redirect-to-https
            # CachingDisabled managed policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # AllViewerExceptHostHeader managed policy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: "/api/*"
            TargetOriginId: ApiGateway
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ── IAM Role ──────────────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MemoryVaultLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockInvoke
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: "*"
              - Sid: ContextBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ContextBucket.Arn
                  - !Sub "${ContextBucket.Arn}/*"
              - Sid: SecretsManagerRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SupabaseSecret

  # ── CloudWatch Log Group (30-day retention) ───────────────────────────────
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 30

  # ── Lambda Layer (Python dependencies) ───────────────────────────────────
  DependenciesLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-deps"
      Description: Python runtime dependencies for MemoryVault
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      Content:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref LambdaLayerKey

  # ── Lambda Function ───────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: app.main.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref DependenciesLayer
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          SUPABASE_SECRET_ARN: !Ref SupabaseSecret
          CONTEXT_BUCKET: !Ref ContextBucket
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          # Supabase URL is non-sensitive, can be in env var
          SUPABASE_URL: "{{resolve:ssm:/memoryvault/supabase/url}}"
          # Secrets are loaded at runtime from Secrets Manager (see app/config.py)

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*"

  # ── API Gateway HTTP API v2 ───────────────────────────────────────────────
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      # No CorsConfiguration here — all browser traffic reaches the API through
      # CloudFront, never directly. CORS at the API Gateway level is dead code
      # in this architecture and caused a circular dependency with Distribution.

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "$default"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # ── Secrets Manager ───────────────────────────────────────────────────────
  SupabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/supabase-connection-string"
      Description: Supabase Postgres connection string — update value after stack creation
      SecretString: '{"connection_string": "REPLACE_ME"}'

Outputs:
  DistributionUrl:
    Description: CloudFront distribution URL (app entry point)
    Value: !Sub "https://${Distribution.DomainName}"
  ApiUrl:
    Description: API Gateway URL (direct, for debugging)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Description: S3 bucket to upload the SvelteKit static build into
    Value: !Ref FrontendBucket
  ContextBucketName:
    Description: S3 bucket for deck context files
    Value: !Ref ContextBucket
  SupabaseSecretArn:
    Description: ARN of the Supabase connection string secret
    Value: !Ref SupabaseSecret
